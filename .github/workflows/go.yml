name: Go CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: true

      - name: Run tests
        # -p 1 runs packages sequentially: the raft integration tests drive
        # real-time leader elections over TCP, and running every package's
        # tests in parallel starves those goroutines of CPU, which makes the
        # timing-sensitive consensus tests flaky. Serializing packages keeps
        # them reliable.
        run: go test -p 1 ./...

      - name: Run vet
        run: go vet ./...